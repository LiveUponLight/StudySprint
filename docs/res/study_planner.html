<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Study Plan Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --border: #2a2a2a;
      --accent: #c8f04d;
      --accent-dim: #9ab83a;
      --text: #e8e8e8;
      --muted: #666;
      --monday: #c8f04d;
      --tuesday: #4df0c8;
      --wednesday: #f04d8a;
      --thursday: #f0c84d;
      --friday: #c84df0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    header {
      padding: 3rem 4rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      animation: fadeDown 0.6s ease both;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
    }

    header h1 span {
      color: var(--accent);
    }

    .tag {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.3rem 0.7rem;
      border-radius: 2px;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    .input-section {
      animation: fadeUp 0.6s ease 0.1s both;
    }

    label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      padding: 1.25rem;
      resize: vertical;
      min-height: 200px;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: var(--muted);
    }

    button {
      margin-top: 1.25rem;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 1rem 2.5rem;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.2s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    button:hover { background: var(--accent-dim); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid #0d0d0d;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    button.loading .spinner { display: inline-block; }
    button.loading .btn-text::after { content: 'Generating...'; }
    button:not(.loading) .btn-text::after { content: 'Generate Study Plan'; }

    .error {
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      border: 1px solid #f04d4d44;
      background: #f04d4d11;
      color: #f09090;
      font-size: 0.8rem;
      border-radius: 4px;
      display: none;
    }

    /* Results */
    #results {
      margin-top: 3rem;
      display: none;
      animation: fadeUp 0.5s ease both;
    }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .results-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .results-header .meta {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .week-card {
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
    }

    .week-header {
      padding: 1rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .week-num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }

    .week-info .week-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .week-info .week-theme {
      font-size: 0.9rem;
      color: var(--text);
      margin-top: 0.1rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .day-col {
      padding: 1.25rem 1rem;
      border-right: 1px solid var(--border);
    }

    .day-col:last-child { border-right: none; }

    .day-name {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid;
    }

    .day-col:nth-child(1) .day-name { color: var(--monday); border-color: var(--monday); }
    .day-col:nth-child(2) .day-name { color: var(--tuesday); border-color: var(--tuesday); }
    .day-col:nth-child(3) .day-name { color: var(--wednesday); border-color: var(--wednesday); }
    .day-col:nth-child(4) .day-name { color: var(--thursday); border-color: var(--thursday); }
    .day-col:nth-child(5) .day-name { color: var(--friday); border-color: var(--friday); }

    .task {
      font-size: 0.72rem;
      line-height: 1.5;
      color: #bbb;
      padding: 0.4rem 0;
      border-bottom: 1px solid #1f1f1f;
      display: flex;
      gap: 0.5rem;
    }

    .task:last-child { border-bottom: none; }

    .task::before {
      content: '—';
      color: var(--border);
      flex-shrink: 0;
    }

    @media (max-width: 700px) {
      header { padding: 2rem 1.5rem 1.5rem; flex-wrap: wrap; }
      main { padding: 2rem 1rem; }
      .days-grid { grid-template-columns: 1fr 1fr; }
      .day-col { border-right: none; border-bottom: 1px solid var(--border); }
      .day-col:last-child { border-bottom: none; }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<header>
  <h1>Study<span>Plan</span></h1>
  <span class="tag">AI Generator</span>
</header>

<main>
  <div class="input-section">
    <label for="syllabus">Paste your syllabus</label>
    <textarea
      id="syllabus"
      placeholder="e.g. Week 1: Intro to Python — variables, loops, functions. Week 2: Data structures..."
    ></textarea>
    <div class="error" id="error"></div>
    <button id="generateBtn" onclick="generate()">
      <span class="spinner"></span>
      <span class="btn-text"></span>
    </button>
  </div>

  <div id="results">
    <div class="results-header">
      <h2 id="planTitle"></h2>
      <span class="meta" id="planMeta"></span>
    </div>
    <div id="weeksContainer"></div>
  </div>
</main>

<script>
  const API_URL = "https://us-central1-api-host-5fd93.cloudfunctions.net/generateStudySprint";
  const DAYS = ["monday","tuesday","wednesday","thursday","friday"];

  async function generate() {
    const syllabus = document.getElementById("syllabus").value.trim();
    const btn = document.getElementById("generateBtn");
    const errorEl = document.getElementById("error");
    const results = document.getElementById("results");

    errorEl.style.display = "none";
    results.style.display = "none";

    if (!syllabus) {
      showError("Please paste your syllabus before generating.");
      return;
    }

    btn.disabled = true;
    btn.classList.add("loading");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ syllabus }),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || "Something went wrong. Try again.");
        return;
      }

      renderPlan(data);

    } catch (err) {
      showError("Network error — check your connection and try again.");
    } finally {
      btn.disabled = false;
      btn.classList.remove("loading");
    }
  }

  function renderPlan(data) {
    document.getElementById("planTitle").textContent = data.title || "Study Plan";
    document.getElementById("planMeta").textContent = `${data.totalWeeks} week${data.totalWeeks !== 1 ? "s" : ""} · Mon–Fri`;

    const container = document.getElementById("weeksContainer");
    container.innerHTML = "";

    (data.weeks || []).forEach((week, i) => {
      const card = document.createElement("div");
      card.className = "week-card";
      card.style.animationDelay = `${i * 0.08}s`;

      const header = document.createElement("div");
      header.className = "week-header";
      header.innerHTML = `
        <div class="week-num">${String(week.week).padStart(2, "0")}</div>
        <div class="week-info">
          <div class="week-label">Week ${week.week}</div>
          <div class="week-theme">${week.theme || ""}</div>
        </div>
      `;

      const grid = document.createElement("div");
      grid.className = "days-grid";

      DAYS.forEach(day => {
        const tasks = (week.days && week.days[day]) || [];
        const col = document.createElement("div");
        col.className = "day-col";
        col.innerHTML = `<div class="day-name">${day}</div>` +
          (tasks.length
            ? tasks.map(t => `<div class="task">${t}</div>`).join("")
            : `<div class="task" style="color:#444">—</div>`);
        grid.appendChild(col);
      });

      card.appendChild(header);
      card.appendChild(grid);
      container.appendChild(card);
    });

    document.getElementById("results").style.display = "block";
    document.getElementById("results").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function showError(msg) {
    const el = document.getElementById("error");
    el.textContent = msg;
    el.style.display = "block";
  }

  // Allow Ctrl+Enter to submit
  document.getElementById("syllabus").addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
  });
</script>
</body>
</html>
